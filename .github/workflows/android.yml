name: Android APK

on:
  push:
    branches: [ "main", "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "Kalorien-Tracker-${{ github.run_number }}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Kalorien-Tracker Build ${{ github.run_number }}
          prerelease: true
          files: Kalorien-Tracker-${{ github.run_number }}.apk
          body: |
            Testversion aus Commit ${{ github.sha }} (Branch ${{ github.ref_name }}).
            Auf dem Handy die APK herunterladen und installieren – sie aktualisiert die vorhandene Testversion, Daten bleiben erhalten.
            Die Foto-KI (Gemma 4 E2B, 2,6 GB) wird in der App unter Einstellungen → KI-Erkennung einmalig geladen.
